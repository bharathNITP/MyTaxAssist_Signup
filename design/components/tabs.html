<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>MyTaxAssist Tabs</title><style>
:root{--bg:#f2ede4;--surface:#fff;--card:#fafaf8;--border:#e0d8cc;--accent:#b8861e;--accentBg:rgba(184,134,30,.10);--text:#1c1610;--textSub:#4a3c28;--muted:#8a7860;--success:#059669;--warning:#d97706}*{box-sizing:border-box}body{margin:0;padding:32px;background:var(--bg);font-family:Segoe UI,system-ui,sans-serif;color:var(--text)}.wrap{max-width:1100px;margin:auto}.section{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:22px;margin-bottom:22px}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tab{border:1px solid var(--border);background:transparent;color:var(--muted);border-radius:14px;padding:6px 12px;font:700 12px Segoe UI,system-ui;display:flex;gap:6px;align-items:center}.tab.active{background:var(--accentBg);border-color:rgba(184,134,30,.35);color:var(--accent)}.count{background:var(--border);color:var(--muted);border-radius:10px;padding:0 6px;font-size:10px}.tab.active .count{background:var(--accent);color:#fff}.panel{margin-top:16px;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px}.mobile-tabs{display:none}.form-tabs{display:flex;flex-direction:column;gap:6px}.form-tab{display:flex;align-items:center;gap:10px;width:100%;padding:10px 11px;background:var(--card);border:1px solid var(--border);border-radius:9px;text-align:left}@media(max-width:767px){body{padding:16px}.tabs{display:none}.mobile-tabs{display:block;width:100%;padding:10px;border-radius:9px;border:1px solid var(--border);background:var(--surface);color:var(--text)}}
</style></head><body><main class="wrap"><h1>Tabs</h1><section class="section"><h2>Status Filter Tabs</h2><div class="tabs"><button class="tab active">All <span class="count">3</span></button><button class="tab">Pending <span class="count">1</span></button><button class="tab">In Progress <span class="count">1</span></button><button class="tab">Filed <span class="count">0</span></button></div><select class="mobile-tabs"><option>All</option><option>Pending</option><option>In Progress</option><option>Filed</option></select><div class="panel">Used in the left case list to filter filing profiles.</div></section><section class="section"><h2>Form List Tabs</h2><div class="form-tabs"><button class="form-tab">👤 <b style="flex:1">Basic Information</b><span style="color:var(--success);font-weight:800">✓ Filled</span> ›</button><button class="form-tab">🏦 <b style="flex:1">Bank Information</b><span style="color:var(--success);font-weight:800">✓ Filled</span> ›</button><button class="form-tab">💼 <b style="flex:1">Salary Information</b><span style="color:var(--warning);font-weight:800">○ Pending</span> ›</button></div></section></main></body></html>
