<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>MyTaxAssist Modals</title><style>
:root{--bg:#f2ede4;--surface:#fff;--card:#fafaf8;--border:#e0d8cc;--accent:#b8861e;--accentLight:#d4a030;--text:#1c1610;--textSub:#4a3c28;--muted:#8a7860;--success:#059669;--warning:#d97706}*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}.demo{padding:32px}.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:20px}.modal{width:min(520px,100%);background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:0 18px 60px rgba(0,0,0,.28);overflow:hidden}.header{padding:18px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px}.icon{width:38px;height:38px;border-radius:10px;background:rgba(184,134,30,.14);border:1px solid rgba(184,134,30,.25);display:flex;align-items:center;justify-content:center}.title{font-size:15px;font-weight:900}.sub{font-size:12px;color:var(--muted);margin-top:2px}.close{margin-left:auto;width:32px;height:32px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--muted);font-weight:800}.body{padding:20px}.footer{padding:14px 20px;border-top:1px solid var(--border);display:flex;gap:10px;justify-content:flex-end}.btn{border:0;border-radius:9px;padding:10px 14px;font:700 13px Segoe UI,system-ui}.primary{background:linear-gradient(135deg,var(--accent),var(--accentLight));color:#fff}.secondary{background:var(--card);border:1px solid var(--border);color:var(--textSub)}.file{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px}.pdf{width:36px;height:36px;background:#ef4444;color:#fff;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900}@media(max-width:767px){.backdrop{align-items:flex-end;padding:0}.modal{border-radius:16px 16px 0 0}.footer{flex-direction:column}.btn{width:100%}}
</style></head><body><div class="demo"><h1>Modals</h1><p>Modal, confirmation and upload-preview pattern. On mobile this becomes a bottom sheet.</p></div><div class="backdrop"><section class="modal"><div class="header"><div class="icon">📕</div><div><div class="title">Upload Form 16</div><div class="sub">Supported: PDF, JPG, PNG up to 10 MB</div></div><button class="close">✕</button></div><div class="body"><p style="color:var(--textSub);line-height:1.6">Please upload your Form 16 for FY 2024-25. The document will be visible in the case document panel.</p><div class="file"><div class="pdf">PDF</div><div style="flex:1"><b>Form16_Priya.pdf</b><div class="sub">2.4 MB</div></div><b style="color:var(--success)">✓</b></div></div><div class="footer"><button class="btn secondary">Cancel</button><button class="btn primary">Upload File</button></div></section></div></body></html>
