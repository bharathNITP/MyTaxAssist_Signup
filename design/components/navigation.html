<!DOCTYPE html>

t:calc(100vh - 60px)}aside{width:290px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column}.side-head{padding:16px;display:flex;justify-content:space-between;align-items:center}.add{border:0;border-radius:8px;background:linear-gradient(135deg,var(--accent),var(--accentLight));color:#fff;padding:7px 14px;font-weight:800}.case{border:0;border-bottom:1px solid var(--border);border-left:3px solid transparent;background:transparent;padding:13px 14px;text-align:left;display:flex;gap:11px}.case.active{background:var(--selectedBg);border-left-color:var(--accent)}main{flex:1;padding:24px}.mobile-menu{display:none}@media(max-width:1023px){aside{position:fixed;left:-290px;top:60px;bottom:0;z-index:20}.search{display:none}.mobile-menu{display:block}.active-case span{display:none}}@media(max-width:767px){nav{height:52px;padding:0 12px}.logo{border-right:0;padding-right:0}.logo div:last-child,.active-case,.user div:last-child{display:none}.controls{margin-left:auto}.layout{height:calc(100vh - 52px)}main{padding:16px}}
