<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>MyTaxAssist Forms</title><style>
:root{--bg:#f2ede4;--surface:#fff;--card:#fafaf8;--border:#e0d8cc;--accent:#b8861e;--accentLight:#d4a030;--text:#1c1610;--textSub:#4a3c28;--muted:#8a7860;--inputBg:#fff;--success:#059669;--warning:#d97706;--danger:#dc2626;--info:#2563eb}*{box-sizing:border-box}body{margin:0;padding:32px;background:var(--bg);font-family:Segoe UI,system-ui,sans-serif;color:var(--text)}.wrap{max-width:1100px;margin:auto}.section{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:22px;margin-bottom:22px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.field{display:flex;flex-direction:column;gap:6px}.label{font-size:12px;color:var(--muted);font-weight:700}.input,.select,.textarea{width:100%;background:var(--inputBg);border:1.5px solid var(--border);border-radius:10px;padding:10px 12px;color:var(--text);font:13px Segoe UI,system-ui;outline:none}.textarea{min-height:92px;resize:vertical}.input:focus,.select:focus,.textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(184,134,30,.12)}.search{position:relative;max-width:340px}.search span{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:14px}.search input{padding-left:34px}.status{display:inline-flex;gap:5px;align-items:center;border-radius:10px;padding:3px 9px;font-size:11px;font-weight:800}.filled{color:var(--success);background:rgba(5,150,105,.12);border:1px solid rgba(5,150,105,.25)}.pending{color:var(--warning);background:rgba(217,119,6,.12);border:1px solid rgba(217,119,6,.25)}.form-row{display:flex;justify-content:space-between;gap:12px;padding:13px 14px;border-radius:8px}.form-row:nth-child(odd){background:var(--card)}.form-row .k{font-size:12px;color:var(--muted);font-weight:600;min-width:140px}.form-row .v{font-size:13px;color:var(--text);font-weight:700;text-align:right}.actions{display:flex;gap:10px;margin-top:18px}.btn{border:0;border-radius:9px;padding:10px 14px;font:700 13px Segoe UI,system-ui;cursor:pointer}.primary{background:linear-gradient(135deg,var(--accent),var(--accentLight));color:#fff}.secondary{background:var(--card);border:1px solid var(--border);color:var(--textSub)}@media(max-width:767px){body{padding:16px}.grid{grid-template-columns:1fr}.actions{flex-direction:column}.form-row{flex-direction:column}.form-row .v{text-align:left}}
</style></head><body><main class="wrap"><h1>Forms</h1>
<section class="section"><h2>Input Fields</h2><div class="grid"><div class="field"><label class="label">Full Name</label><input class="input" value="Priya Sharma"></div><div class="field"><label class="label">PAN Number</label><input class="input" value="ABCPS1234D"></div><div class="field"><label class="label">Filing Type</label><select class="select"><option>Salaried</option><option>Self-employed</option></select></div><div class="field"><label class="label">Assessment Year</label><input class="input" value="2025-26"></div><div class="field" style="grid-column:1/-1"><label class="label">Address</label><textarea class="textarea">204, Prestige Park, Whitefield, Bengaluru – 560066</textarea></div></div><div class="actions"><button class="btn primary">Save Details</button><button class="btn secondary">Cancel</button></div></section>
<section class="section"><h2>Search Fields</h2><div class="search"><span>🔍</span><input class="input" placeholder="Search anything…"></div></section>
<section class="section"><h2>Read-only Form Drawer Rows</h2><p><span class="status filled">● Filled</span> <span class="status pending">○ Pending</span></p><div><div class="form-row"><span class="k">Bank Name</span><span class="v">HDFC Bank</span></div><div class="form-row"><span class="k">Account Number</span><span class="v">XXXX XXXX 8821</span></div><div class="form-row"><span class="k">IFSC Code</span><span class="v">HDFC0001234</span></div><div class="form-row"><span class="k">Refund to this account</span><span class="v">Yes</span></div></div></section>
</main></body></html>
