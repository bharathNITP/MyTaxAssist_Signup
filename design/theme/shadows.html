<!DOCTYPE html>
<html>
<head>
  <title>MyTaxAssist - Shadows</title>
</head>
<body style="font-family: Segoe UI, system-ui, sans-serif; background:#f2ede4; color:#1c1610; padding:24px;">

  <h1>MyTaxAssist Shadow System</h1>

  <div style="display:grid; grid-template-columns:repeat(3,1fr); gap:24px;">

    <div style="background:white; padding:24px; border-radius:12px; box-shadow:0 2px 8px rgba(0,0,0,0.08);">
      <h3>Small Shadow</h3>
      <p>Use for cards and small floating elements.</p>
      <code>0 2px 8px rgba(0,0,0,0.08)</code>
    </div>

    <div style="background:white; padding:24px; border-radius:12px; box-shadow:0 8px 24px rgba(0,0,0,0.12);">
      <h3>Medium Shadow</h3>
      <p>Use for dropdowns, popovers, notifications.</p>
      <code>0 8px 24px rgba(0,0,0,0.12)</code>
    </div>

    <div style="background:white; padding:24px; border-radius:12px; box-shadow:-12px 0 48px rgba(0,0,0,0.30);">
      <h3>Drawer Shadow</h3>
      <p>Use for side drawers and overlay panels.</p>
      <code>-12px 0 48px rgba(0,0,0,0.30)</code>
    </div>

  </div>

</body>
</html>
